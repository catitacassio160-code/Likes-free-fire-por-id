<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviador de Likes - Free Fire</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');
        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31103f 100%);
            color: #f8fafc;
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.4);
        }
        .glow-button {
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
            transition: all 0.3s ease;
        }
        .glow-button:hover {
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.9);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 selection:bg-orange-500 selection:text-white">

    <!-- Cabeçalho -->
    <header class="w-full max-w-md mx-auto text-center py-6">
        <div class="inline-block p-3 bg-orange-600/20 rounded-2xl border border-orange-500/30 mb-2 glow-effect">
            <i class="fa-solid fa-fire text-4xl text-orange-500"></i>
        </div>
        <h1 class="text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-200">FF LIKE GENERATOR</h1>
        <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Sistema Oficial de Envio por ID</p>
    </header>

    <!-- Conteúdo Principal / Formulário -->
    <main class="w-full max-w-md mx-auto bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
        
        <!-- Fundo decorativo -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-orange-500/10 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-purple-500/10 rounded-full blur-2xl"></div>

        <form id="likeForm" onsubmit="handleSendLikes(event)" class="space-y-5 relative z-10">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2" for="playerId">
                    <i class="fa-solid fa-id-card text-orange-500 mr-2"></i> ID do Jogador (Free Fire)
                </label>
                <input 
                    type="text" 
                    id="playerId" 
                    required 
                    placeholder="Ex: 1234567890" 
                    class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all text-lg tracking-wider"
                >
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2" for="likeAmount">
                    <i class="fa-solid fa-thumbs-up text-orange-500 mr-2"></i> Quantidade de Likes
                </label>
                <select 
                    id="likeAmount" 
                    class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all text-lg"
                >
                    <option value="50">50 Likes (Rápido)</option>
                    <option value="100">100 Likes (Padrão)</option>
                    <option value="200">200 Likes (Avançado)</option>
                    <option value="500">500 Likes (VIP)</option>
                </select>
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-bold py-3.5 px-6 rounded-xl glow-button flex items-center justify-center space-x-2 text-lg uppercase tracking-wider cursor-pointer"
            >
                <i class="fa-solid fa-paper-plane"></i>
                <span>Enviar Likes Agora</span>
            </button>
        </form>

        <!-- Caixa de Status / Carregamento -->
        <div id="statusBox" class="hidden mt-6 p-4 rounded-xl border bg-slate-800/60 border-slate-700 text-center relative z-10 transition-all">
            <div id="loadingState" class="flex flex-col items-center space-y-3">
                <div class="w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                <p id="statusText" class="text-sm font-medium text-slate-300">Conectando ao servidor do Free Fire...</p>
            </div>
            <div id="successState" class="hidden flex flex-col items-center space-y-2">
                <div class="w-10 h-10 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center text-xl border border-green-500/40">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h3 class="text-lg font-bold text-green-400">Likes Enviados com Sucesso!</h3>
                <p id="successDetails" class="text-xs text-slate-400"></p>
            </div>
        </div>

    </main>

    <!-- Modal de Mensagem / Alerta Personalizado (Evita alert nativo) -->
    <div id="customModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl space-y-4">
            <div class="w-12 h-12 bg-orange-500/20 text-orange-500 rounded-full flex items-center justify-center mx-auto text-xl border border-orange-500/30">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="modalTitle" class="text-lg font-bold text-white">Aviso</h3>
            <p id="modalMessage" class="text-sm text-slate-400"></p>
            <button onclick="closeModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-2.5 rounded-xl transition-all">
                Entendido
            </button>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="w-full max-w-md mx-auto text-center py-4 text-xs text-slate-500">
        <p>&copy; 2026 FF Like System. Todos os direitos reservados.</p>
    </footer>

    <!-- Script de Interação -->
    <script>
        function showModal(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        function handleSendLikes(event) {
            event.preventDefault();
            const playerId = document.getElementById('playerId').value.trim();
            const likeAmount = document.getElementById('likeAmount').value;

            if (!playerId || playerId.length < 5) {
                showModal("ID Inválido", "Por favor, introduz um ID de Free Fire válido.");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');
            const loadingState = document.getElementById('loadingState');
            const successState = document.getElementById('successState');
            const statusText = document.getElementById('statusText');
            const successDetails = document.getElementById('successDetails');

            // Desativar botão e limpar estados anteriores
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            statusBox.classList.remove('hidden');
            loadingState.classList.remove('hidden');
            successState.classList.add('hidden');

            // Simulação de passos de conexão
            setTimeout(() => {
                statusText.innerText = `A procurar o ID: ${playerId}...`;
            }, 1000);

            setTimeout(() => {
                statusText.innerText = `A injetar ${likeAmount} likes na conta...`;
            }, 2500);

            setTimeout(() => {
                loadingState.classList.add('hidden');
                successState.classList.remove('hidden');
                successDetails.innerText = `Foram enviados ${likeAmount} likes com sucesso para o ID ${playerId}.`;
                
                // Reativar botão
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }, 4000);
        }
    </script>
</body>
</html>
